name: Deploy to GitHub Pages

on:
  # собирать при каждом пуше в main
  push:
    branches: [main]
  # и по кнопке во вкладке Actions
  workflow_dispatch:

# права, которые нужны для публикации
permissions:
  contents: read
  pages: write
  id-token: write

# если пушнуть дважды подряд, второй деплой подождёт первый
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Отдать сборку на публикацию
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
